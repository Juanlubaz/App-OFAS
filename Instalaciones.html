<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Instalaciones - Gestiproject</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #6fb543, #79c255); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .container { background: white; width: 100%; max-width: 900px; border-radius: 20px; padding: 40px; box-shadow: 0 6px 20px rgba(0,0,0,0.15); text-align: center; }
    .logos { display: flex; justify-content: center; align-items: center; margin-bottom: 30px; flex-wrap: wrap; }
    .logos img { max-height: 120px; max-width: 100%; height: auto; width: auto; object-fit: contain; }
    h1 { color: #4e7e28; margin-bottom: 30px; font-size: 28px; }

    .options-box {
        border: 2px dashed #79c255;
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 25px;
        background-color: #f9fdf6;
    }
    .options-title { font-size: 14px; color: #4e7e28; font-weight: bold; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
    .options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 0 auto; }

    .form-group { max-width: 740px; margin: 0 auto 20px auto; text-align: left; }
    label { display: block; color: #555; font-weight: 600; margin-bottom: 8px; font-size: 1.1em; }
    select { width: 100%; padding: 14px 15px; border: 2px solid #ddd; border-radius: 12px; font-size: 16px; background: white; cursor: pointer; transition: border-color 0.3s; outline: none; }
    select:focus { border-color: #79c255; }
    select:disabled { background: #f5f5f5; cursor: not-allowed; border-color: #eee; }

    .docs-box {
        display: none;
        background: #f4fbf1;
        border: 1px solid #ccebc4;
        border-radius: 12px;
        padding: 20px;
        margin: 20px auto;
        max-width: 740px;
        text-align: left;
    }
    .docs-title { font-size: 15px; color: #4e7e28; font-weight: bold; margin-bottom: 12px; }
    .docs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    
    .btn-pdf-file {
        background: #79c255;
        color: white;
        font-size: 14px;
        padding: 12px 15px;
        border-radius: 10px;
        border: none;
        box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
        transition: all 0.2s;
        font-weight: 600;
        display: block;
        width: 100%;
    }
    .btn-pdf-file:hover { background: #609e42; transform: translateY(-2px); }

    button.btn-option { padding: 15px; border-radius: 12px; font-size: 15px; border: 2px solid #ccc; cursor: pointer; background: #fff; box-shadow: 0 3px 6px rgba(0,0,0,0.08); transition: all 0.2s ease; font-weight: 600; color: #333; }
    button.btn-option:hover:not(:disabled) { background: #e8e8e8; transform: translateY(-2px); }
    button.btn-option.active { background: #79c255; color: white; border-color: #4e7e28; }
    
    button.btn-option:disabled {
        background: #f0f0f0;
        color: #aaa;
        border-color: #e0e0e0;
        cursor: not-allowed;
        box-shadow: none;
    }

    .back-link { display: inline-block; margin-top: 30px; color: #79c255; text-decoration: none; font-weight: bold; font-size: 16px; }
    .back-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="container">
    <div class="logos">
        <img src="https://raw.githubusercontent.com/Juanlubaz/Enlaces-estructuras-TSP3/main/GESTI.png" alt="Gestiproject Logo" />
    </div>
    
    <h1>Installations Documents</h1>

    <div class="options-box">
        <div class="options-title">Selecciona una Instalación</div>
        <div class="options-grid">
            <button type="button" class="btn-option" onclick="onCategoryClick('aire', this)">AIRE COMPRIMIDO</button>
            <button type="button" class="btn-option" disabled>HVAC</button>
            <button type="button" class="btn-option" onclick="onCategoryClick('pci', this)">PCI</button>
            <button type="button" class="btn-option" disabled>VAPOR</button>
            <button type="button" class="btn-option" disabled>AMONIACO</button>
            <button type="button" class="btn-option" disabled>FUEL Y PARAFINAS</button>
            <button type="button" class="btn-option" disabled>ELECTRICIDAD Y CONTROL</button>
        </div>
    </div>

    <div id="containerSub1" class="form-group" style="display:none;">
        <label id="labelSub1" for="selectSub1">Selecciona una opción:</label>
        <select id="selectSub1">
            <option value="">-- Selecciona --</option>
        </select>
    </div>

    <div id="containerSub2" class="form-group" style="display:none;">
        <label id="labelSub2" for="selectSub2">Selecciona subcarpeta:</label>
        <select id="selectSub2">
            <option value="">-- Selecciona --</option>
        </select>
    </div>

    <div id="docsBox" class="docs-box">
        <div class="docs-title">📄 Documentos disponibles (Pulsa para abrir):</div>
        <div id="docsGrid" class="docs-grid"></div>
    </div>

    <a href="principal.html" class="back-link">← Back to Principal</a>
</div>

<script>
    const sessionToken = localStorage.getItem('sessionToken');
    if (!sessionToken) { window.location.href = 'index.html'; }

    // CONTROL DE INACTIVIDAD (5 MINUTOS)
    (function() {
        const TIEMPO_INACTIVIDAD_MS = 5 * 60 * 1000;
        let timerInactividad;

        function cerrarSesionPorInactividad() {
            localStorage.removeItem('sessionToken');
            localStorage.removeItem('loggedUser');
            localStorage.clear();
            alert("Tu sesión ha expirado por inactividad (5 minutos). Por favor, vuelve a iniciar sesión.");
            window.location.href = 'index.html';
        }

        function reiniciarTemporizador() {
            clearTimeout(timerInactividad);
            timerInactividad = setTimeout(cerrarSesionPorInactividad, TIEMPO_INACTIVIDAD_MS);
        }

        const eventosActividad = ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'];
        eventosActividad.forEach(evento => {
            window.addEventListener(evento, reiniciarTemporizador, { passive: true });
        });

        reiniciarTemporizador();
    })();

    const SCRIPT_PUENTE_URL = "https://script.google.com/macros/s/AKfycby5kptA52YPD4noy_GwoLIYNkHpATmvDtmGASnlo5GB6m-ozHRqU4F4t_jR5-uhbrhJRA/exec";
    const VISOR_PDF_URL = 'https://script.google.com/macros/s/AKfycbyAA7JN9jnHYTtQKLUZeNEvBTQm-kl9HMlVxyp_ddFB7ME7RUJzTBylxx6FyyW8RMQl8Q/exec';

    const DRIVE_IDS = {
        AIRE_COMPRESORES: '1wnHMBcPpauOus-ntvaiTFijrQPw2aRcJ',
        AIRE_ACUMULADORES: '1_lzew4_tq1ADlq_VYWU-OWdDfFE7mezE',
        PCI_FICHAS: '1Mg3drsikYpdWvE6Eq5UpJmyumWYbaBTU',
        PCI_PLANOS: '1wcVn5Bs98kc9I7zoinUkUpVE_8eCoAZg'
    };

    let activeCategory = '';
    let activeCallbackCount = 0;

    function onCategoryClick(category, btnElement) {
        document.querySelectorAll('.btn-option').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');

        activeCategory = category;
        resetFormUI();

        const containerSub1 = document.getElementById('containerSub1');
        const selectSub1 = document.getElementById('selectSub1');

        if (category === 'aire') {
            containerSub1.style.display = 'block';
            selectSub1.innerHTML = `
                <option value="">-- Selecciona una opción --</option>
                <option value="compresores">Compresores</option>
                <option value="acumuladores">Depósitos</option>
            `;
        } 
        else if (category === 'pci') {
            containerSub1.style.display = 'block';
            selectSub1.innerHTML = `
                <option value="">-- Selecciona una opción --</option>
                <option value="fichas">Fichas técnicas</option>
                <option value="planos">Planos</option>
            `;
        }
    }

    document.getElementById('selectSub1').addEventListener('change', function() {
        const val = this.value;
        hideDocsBox();
        document.getElementById('containerSub2').style.display = 'none';

        if (!val) return;

        if (activeCategory === 'aire') {
            if (val === 'compresores') {
                requestDriveData(DRIVE_IDS.AIRE_COMPRESORES, "cbRenderSubfolders");
            } else if (val === 'acumuladores') {
                requestDriveData(DRIVE_IDS.AIRE_ACUMULADORES, "cbRenderSubfolders");
            }
        } 
        else if (activeCategory === 'pci') {
            if (val === 'fichas') {
                requestDriveData(DRIVE_IDS.PCI_FICHAS, "cbRenderSubfolders");
            } else if (val === 'planos') {
                requestDriveData(DRIVE_IDS.PCI_PLANOS, "cbRenderFilesDirectly");
            }
        }
    });

    document.getElementById('selectSub2').addEventListener('change', function() {
        const folderId = this.value;
        hideDocsBox();
        if (!folderId) return;

        requestDriveData(folderId, "cbRenderFilesDirectly");
    });

    window.cbRenderSubfolders = function(response) {
        const containerSub2 = document.getElementById('containerSub2');
        const selectSub2 = document.getElementById('selectSub2');

        if (!response || response.status === "error" || !response.folders || response.folders.length === 0) {
            alert("No se encontraron subcarpetas dentro de esta sección.");
            return;
        }

        selectSub2.innerHTML = '<option value="">-- Selecciona una subcarpeta --</option>';
        response.folders.forEach(sf => {
            let opt = document.createElement('option');
            opt.value = sf.id;
            opt.innerText = sf.name;
            selectSub2.appendChild(opt);
        });

        containerSub2.style.display = 'block';
    };

    window.cbRenderFilesDirectly = function(response) {
        if (!response || response.status === "error") {
            alert("Error al conectar con Google Drive.");
            return;
        }

        let pdfFilesOnly = [];
        if (response.files && response.files.length > 0) {
            pdfFilesOnly = response.files.filter(file => {
                const esMimePdf = file.mimeType === 'application/pdf';
                const esExtPdf = file.name && file.name.toLowerCase().endsWith('.pdf');
                return esMimePdf || esExtPdf;
            });
        }

        if (pdfFilesOnly.length > 0) {
            renderPdfFiles(pdfFilesOnly);
        } else {
            alert("Esta carpeta no contiene ningún archivo PDF.");
        }
    };

    function renderPdfFiles(files) {
        const box = document.getElementById('docsBox');
        const grid = document.getElementById('docsGrid');
        grid.innerHTML = '';

        files.forEach(file => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'btn-pdf-file';
            btn.title = file.name;
            btn.innerText = "📄 " + file.name;
            btn.onclick = function() { abrirVisor(file.id); };
            grid.appendChild(btn);
        });

        box.style.display = 'block';
    }

    function abrirVisor(fileId) {
        var separador = VISOR_PDF_URL.includes('?') ? '&' : '?';
        var visorUrl = VISOR_PDF_URL + separador + 'id=' + encodeURIComponent(fileId);
        window.open(visorUrl, '_blank', 'noopener,noreferrer');
    }

    function resetFormUI() {
        document.getElementById('containerSub1').style.display = 'none';
        document.getElementById('containerSub2').style.display = 'none';
        document.getElementById('selectSub1').innerHTML = '';
        document.getElementById('selectSub2').innerHTML = '';
        hideDocsBox();
    }

    function hideDocsBox() {
        document.getElementById('docsBox').style.display = 'none';
    }

    function requestDriveData(folderId, callbackName) {
        const token = localStorage.getItem('sessionToken');
        if (!token) { window.location.href = 'index.html'; return; }

        activeCallbackCount++;
        const uniqueCallback = callbackName + "_" + activeCallbackCount;
        
        window[uniqueCallback] = function(data) {
            if (data && data.status === "unauthorized") {
                alert(data.message);
                localStorage.clear();
                window.location.href = 'index.html';
                return;
            }

            window[callbackName](data);
            delete window[uniqueCallback];
        };

        const script = document.createElement('script');
        script.src = SCRIPT_PUENTE_URL + "?folderId=" + encodeURIComponent(folderId) + "&token=" + encodeURIComponent(token) + "&callback=" + encodeURIComponent(uniqueCallback);
        document.body.appendChild(script);
    }
</script>

</body>
</html>
