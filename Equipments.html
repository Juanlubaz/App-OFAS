<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Equipment Search - GestiProject</title>
<style>
    /* ESTILOS BASE Y ESTÉTICA EXACTA A LA IMAGEN */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #6fb543, #79c255); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .container { background: white; width: 100%; max-width: 900px; border-radius: 20px; padding: 40px; box-shadow: 0 6px 20px rgba(0,0,0,0.15); text-align: center; }
    
    .logos { display: flex; justify-content: center; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
    .logos img { max-height: 100px; max-width: 100%; height: auto; width: auto; object-fit: contain; }
    
    h1 { color: #4e7e28; margin-bottom: 25px; font-size: 28px; font-weight: bold; }

    /* RECUADRO DE SEARCH CRITERIA CON BORDE PUNTEADO VERDE */
    .options-box {
        border: 2px dashed #79c255;
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 25px;
        background-color: #ffffff;
    }
    .options-title { font-size: 13px; color: #4e7e28; font-weight: 800; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1.5px; }
    
    .options-grid { 
        display: grid; 
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
        gap: 15px; 
        max-width: 550px;
        margin: 0 auto; 
    }

    /* BOTONES DE MANUFACTURER Y EQUIPMENT TYPE */
    button.btn-criteria {
        padding: 16px 20px;
        border-radius: 12px;
        font-size: 15px;
        border: 2px solid #ddd;
        cursor: pointer;
        background: #ffffff;
        box-shadow: 0 4px 10px rgba(0,0,0,0.06);
        transition: all 0.25s ease;
        font-weight: bold;
        color: #333;
        text-transform: uppercase;
    }
    button.btn-criteria:hover { background: #f5f5f5; transform: translateY(-2px); }
    
    button.btn-criteria.active { 
        background: #79c255; 
        color: white; 
        border-color: #5d9d3f; 
        box-shadow: 0 4px 12px rgba(121, 194, 85, 0.4);
    }

    /* DESPLEGABLES */
    .form-group { max-width: 740px; margin: 0 auto 20px auto; text-align: left; }
    label { display: block; color: #555; font-weight: 600; margin-bottom: 8px; font-size: 1.1em; }
    select { width: 100%; padding: 14px 15px; border: 2px solid #ddd; border-radius: 12px; font-size: 16px; background: white; cursor: pointer; transition: border-color 0.3s; outline: none; }
    select:focus { border-color: #79c255; }
    select:disabled { background: #f5f5f5; cursor: not-allowed; border-color: #eee; }

    /* DOCUMENTOS PDF */
    .docs-box {
        display: none;
        background: #f4fbf1;
        border: 1px solid #ccebc4;
        border-radius: 12px;
        padding: 20px;
        margin: 20px auto;
        max-width: 740px;
        text-align: left;
    }
    .docs-title { font-size: 15px; color: #4e7e28; font-weight: bold; margin-bottom: 12px; }
    .docs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    
    .btn-pdf-file {
        background: #79c255;
        color: white;
        font-size: 14px;
        padding: 12px 15px;
        border-radius: 10px;
        border: none;
        box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
        transition: all 0.2s;
        font-weight: 600;
        display: block;
        width: 100%;
    }
    .btn-pdf-file:hover { background: #609e42; transform: translateY(-2px); }

    .back-link { display: inline-block; margin-top: 30px; color: #79c255; text-decoration: none; font-weight: bold; font-size: 16px; }
    .back-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="container">
    <div class="logos">
        <img src="https://raw.githubusercontent.com/Juanlubaz/Enlaces-estructuras-TSP3/main/GESTI.png" alt="Gestiproject Logo" />
    </div>
    
    <h1>Equipment Search</h1>

    <div class="options-box">
        <div class="options-title">SEARCH CRITERIA</div>
        <div class="options-grid">
            <button type="button" id="btnManufacturer" class="btn-criteria" onclick="selectCriteria('manufacturer')">MANUFACTURER</button>
            <button type="button" id="btnEquipmentType" class="btn-criteria active" onclick="selectCriteria('equipment')">EQUIPMENT TYPE</button>
        </div>
    </div>

    <div id="dropdownsContainer">
        <div class="form-group">
            <label id="labelNivel1" for="selectNivel1">Selecciona Tipo de Equipo:</label>
            <select id="selectNivel1">
                <option value="">-- Conectando con Google Drive... --</option>
            </select>
        </div>

        <div class="form-group">
            <label id="labelNivel2" for="selectNivel2">Selecciona Fabricante:</label>
            <select id="selectNivel2" disabled>
                <option value="">-- Esperando selección superior --</option>
            </select>
        </div>
    </div>

    <div id="docsBox" class="docs-box">
        <div class="docs-title">📄 Documentos disponibles (Pulsa para abrir):</div>
        <div id="docsGrid" class="docs-grid"></div>
    </div>

    <a href="principal.html" class="back-link">← Back to Principal</a>
</div>

<script>
    if (localStorage.getItem('isLoggedIn') !== 'true') {
        window.location.href = 'index.html';
    }

    // CONTROL DE INACTIVIDAD (5 MINUTOS)
    (function() {
        const TIEMPO_INACTIVIDAD_MS = 5 * 60 * 1000;
        let timerInactividad;

        function cerrarSesionPorInactividad() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('loggedUser');
            alert("Tu sesión ha expirado por inactividad (5 minutos). Por favor, vuelve a iniciar sesión.");
            window.location.href = 'index.html';
        }

        function reiniciarTemporizador() {
            clearTimeout(timerInactividad);
            timerInactividad = setTimeout(cerrarSesionPorInactividad, TIEMPO_INACTIVIDAD_MS);
        }

        ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(e => {
            window.addEventListener(e, reiniciarTemporizador, { passive: true });
        });

        reiniciarTemporizador();
    })();

    const ROOT_FOLDER_ID = "1KE1UtCPFc02h7tvcWxql20sD2h_Fdq_p";
    const SCRIPT_PUENTE_URL = "https://script.google.com/macros/s/AKfycby5kptA52YPD4noy_GwoLIYNkHpATmvDtmGASnlo5GB6m-ozHRqU4F4t_jR5-uhbrhJRA/exec";
    const VISOR_PDF_URL = 'https://script.google.com/macros/s/AKfycbyAA7JN9jnHYTtQKLUZeNEvBTQm-kl9HMlVxyp_ddFB7ME7RUJzTBylxx6FyyW8RMQl8Q/exec';

    let activeCallbackCount = 0;
    let currentCriteria = 'equipment'; 
    let equipmentFolders = [];
    let manufacturerMap = {}; // Guarda { "NombreFabricante": [ { id: "...", equipmentName: "..." } ] }

    function initLiveDriveSearch() {
        requestDriveData(ROOT_FOLDER_ID, function(response) {
            const select1 = document.getElementById('selectNivel1');
            if (!response || response.status === "error" || !response.folders) {
                select1.innerHTML = '<option value="">Error al conectar con Google Drive</option>';
                return;
            }

            equipmentFolders = response.folders;
            
            // Una vez leídas las carpetas raíz de Equipos, escaneamos secuencialmente los Fabricantes para tener la lista de MANUFACTURER precargada
            cargarMapaFabricantes(function() {
                renderNivel1();
            });
        });
    }

    // Carga secuencial para no saturate el backend de Apps Script
    function cargarMapaFabricantes(callback) {
        manufacturerMap = {};
        let index = 0;

        function cargarSiguiente() {
            if (index >= equipmentFolders.length) {
                callback();
                return;
            }

            let eqFolder = equipmentFolders[index];
            requestDriveData(eqFolder.id, function(res) {
                if (res && res.folders) {
                    res.folders.forEach(mfFolder => {
                        let nombreMf = mfFolder.name.trim();
                        if (!manufacturerMap[nombreMf]) {
                            manufacturerMap[nombreMf] = [];
                        }
                        manufacturerMap[nombreMf].push({
                            id: mfFolder.id,
                            equipmentName: eqFolder.name
                        });
                    });
                }
                index++;
                cargarSiguiente();
            });
        }

        cargarSiguiente();
    }

    function selectCriteria(criteria) {
        if (currentCriteria === criteria) return;
        
        currentCriteria = criteria;
        
        document.getElementById('btnManufacturer').classList.toggle('active', criteria === 'manufacturer');
        document.getElementById('btnEquipmentType').classList.toggle('active', criteria === 'equipment');

        hideDocsBox();
        renderNivel1();
    }

    function renderNivel1() {
        const select1 = document.getElementById('selectNivel1');
        const select2 = document.getElementById('selectNivel2');
        const label1 = document.getElementById('labelNivel1');
        const label2 = document.getElementById('labelNivel2');

        select1.innerHTML = '';
        select2.innerHTML = '<option value="">-- Esperando selección superior --</option>';
        select2.disabled = true;

        if (currentCriteria === 'equipment') {
            label1.innerText = 'Selecciona Tipo de Equipo:';
            label2.innerText = 'Selecciona Fabricante:';
            
            select1.innerHTML = '<option value="">-- Selecciona un Equipo --</option>';
            equipmentFolders.forEach(folder => {
                let opt = document.createElement('option');
                opt.value = folder.id;
                opt.innerText = folder.name;
                select1.appendChild(opt);
            });
        } else {
            label1.innerText = 'Selecciona Fabricante:';
            label2.innerText = 'Selecciona Tipo de Equipo:';
            
            let fabricantesOrdenados = Object.keys(manufacturerMap).sort((a,b) => a.localeCompare(b));
            
            if (fabricantesOrdenados.length === 0) {
                select1.innerHTML = '<option value="">No se encontraron fabricantes</option>';
                return;
            }

            select1.innerHTML = '<option value="">-- Selecciona un Fabricante --</option>';
            fabricantesOrdenados.forEach(mName => {
                let opt = document.createElement('option');
                opt.value = mName;
                opt.innerText = mName;
                select1.appendChild(opt);
            });
        }
    }

    function onNivel1Change() {
        const val1 = document.getElementById('selectNivel1').value;
        const select2 = document.getElementById('selectNivel2');
        
        hideDocsBox();
        select2.disabled = true;

        if (!val1) {
            select2.innerHTML = '<option value="">-- Esperando selección superior --</option>';
            return;
        }

        if (currentCriteria === 'equipment') {
            // Cargar fabricantes del equipo seleccionado
            select2.innerHTML = '<option value="">Consultando fabricantes en Drive...</option>';

            requestDriveData(val1, function(response) {
                if (!response || response.status === "error") {
                    select2.innerHTML = '<option value="">Error al cargar fabricantes</option>';
                    return;
                }

                let subfolders = response.folders || [];
                let pdfFilesOnly = (response.files || []).filter(f => f.mimeType === 'application/pdf' || (f.name && f.name.toLowerCase().endsWith('.pdf')));

                if (subfolders.length > 0) {
                    select2.innerHTML = '<option value="">-- Selecciona Fabricante --</option>';
                    subfolders.forEach(sf => {
                        let opt = document.createElement('option');
                        opt.value = sf.id;
                        opt.innerText = sf.name;
                        select2.appendChild(opt);
                    });
                    select2.disabled = false;
                } else {
                    select2.innerHTML = '<option value="">-- Sin subcarpetas de fabricante --</option>';
                }

                if (pdfFilesOnly.length > 0) {
                    renderPdfFiles(pdfFilesOnly);
                }
            });
        } else {
            // Cargar tipos de equipo para el fabricante seleccionado
            let eqList = manufacturerMap[val1] || [];

            if (eqList.length > 0) {
                select2.innerHTML = '<option value="">-- Selecciona Tipo de Equipo --</option>';
                eqList.forEach(item => {
                    let opt = document.createElement('option');
                    opt.value = item.id;
                    opt.innerText = item.equipmentName;
                    select2.appendChild(opt);
                });
                select2.disabled = false;
            } else {
                select2.innerHTML = '<option value="">-- Sin equipos asociados --</option>';
            }
        }
    }

    function onNivel2Change() {
        const folderId = document.getElementById('selectNivel2').value;
        if (!folderId) return;

        hideDocsBox();
        requestDriveData(folderId, function(response) {
            if (!response || response.status === "error") return;

            let pdfFilesOnly = (response.files || []).filter(f => f.mimeType === 'application/pdf' || (f.name && f.name.toLowerCase().endsWith('.pdf')));
            
            if (pdfFilesOnly.length > 0) {
                renderPdfFiles(pdfFilesOnly);
            } else {
                alert("Esta carpeta no contiene archivos PDF directamente.");
            }
        });
    }

    function renderPdfFiles(files) {
        const box = document.getElementById('docsBox');
        const grid = document.getElementById('docsGrid');
        grid.innerHTML = '';

        files.forEach(file => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'btn-pdf-file';
            btn.title = file.name;
            btn.innerText = "📄 " + file.name;
            btn.onclick = function() { abrirVisor(file.id); };
            grid.appendChild(btn);
        });

        box.style.display = 'block';
    }

    function abrirVisor(fileId) {
        var separador = VISOR_PDF_URL.includes('?') ? '&' : '?';
        var visorUrl = VISOR_PDF_URL + separador + 'id=' + encodeURIComponent(fileId);
        window.open(visorUrl, '_blank', 'noopener,noreferrer');
    }

    function hideDocsBox() {
        document.getElementById('docsBox').style.display = 'none';
    }

    function requestDriveData(folderId, callback) {
        activeCallbackCount++;
        const callbackName = "cb_eq_" + activeCallbackCount;
        
        window[callbackName] = function(data) {
            callback(data);
            delete window[callbackName];
            const scriptEl = document.getElementById(callbackName);
            if (scriptEl) scriptEl.remove();
        };

        const script = document.createElement('script');
        script.id = callbackName;
        script.src = SCRIPT_PUENTE_URL + "?folderId=" + encodeURIComponent(folderId) + "&callback=" + encodeURIComponent(callbackName);
        document.body.appendChild(script);
    }

    document.getElementById('selectNivel1').addEventListener('change', onNivel1Change);
    document.getElementById('selectNivel2').addEventListener('change', onNivel2Change);

    window.onload = initLiveDriveSearch;
</script>

</body>
</html>
