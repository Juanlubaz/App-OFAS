<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Formulario de contacto.">
  <title>Contacto</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body class="pagina-contacto">
  <main class="contacto-layout">
    <section class="tarjeta-formulario" aria-labelledby="titulo-contacto">
      <a class="volver" href="index.html" aria-label="Volver a la página principal">← Volver</a>

      <h1 id="titulo-contacto">Contáctanos</h1>
      <p class="introduccion">
        Estamos realizando cambios para brindarte una mejor experiencia.
        Completa el formulario y nos pondremos en contacto contigo.
      </p>

      <form
        action="https://formsubmit.co/juanlubaz@gmail.com"
        method="POST"
        accept-charset="UTF-8"
      >
        <input type="hidden" name="_subject" value="Nuevo mensaje desde la web">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_captcha" value="true">
        <input type="text" name="_honey" class="oculto" tabindex="-1" autocomplete="off">

        <div class="campo">
          <label for="nombre">Nombre completo <span>*</span></label>
          <input
            id="nombre"
            name="Nombre"
            type="text"
            placeholder="Escribe tu nombre completo"
            autocomplete="name"
            required
          >
        </div>

        <div class="campo">
          <label for="correo">Correo electrónico <span>*</span></label>
          <input
            id="correo"
            name="Correo"
            type="email"
            placeholder="Escribe tu correo electrónico"
            autocomplete="email"
            required
          >
        </div>

        <div class="campo">
          <label for="asunto">Asunto <span>*</span></label>
          <select id="asunto" name="Asunto" required>
            <option value="" selected disabled>Selecciona un asunto</option>
            <option>Información general</option>
            <option>Soporte</option>
            <option>Presupuesto</option>
            <option>Otro</option>
          </select>
        </div>

        <div class="campo">
          <label for="mensaje">Mensaje <span>*</span></label>
          <textarea
            id="mensaje"
            name="Mensaje"
            rows="6"
            placeholder="Escribe tu mensaje aquí..."
            required
          ></textarea>
        </div>

        <label class="privacidad">
          <input type="checkbox" name="Acepta privacidad" value="Sí" required>
          <span>Acepto que mis datos se utilicen para responder a esta consulta.</span>
        </label>

        <button class="boton boton-enviar" type="submit">Enviar mensaje</button>
        <p class="nota">* Campos obligatorios</p>
      </form>
    </section>
  </main>
</body>
</html>
