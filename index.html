<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acceso - Gestiproject</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #6fb543, #79c255);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }
    .container {
        background: white;
        width: 100%;
        max-width: 480px;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        text-align: center;
    }
    .logos img { max-height: 110px; margin-bottom: 25px; }
    h1 { color: #4e7e28; margin-bottom: 30px; font-size: 26px; }
    .form-group { text-align: left; margin-bottom: 20px; }
    label { display: block; color: #4e7e28; font-size: 14px; margin-bottom: 8px; font-weight: bold; }
    input[type="text"], input[type="password"] {
        width: 100%;
        padding: 15px;
        border: 2px solid #f3f3f3;
        border-radius: 12px;
        font-size: 16px;
        outline: none;
        background: #f9f9f9;
        transition: all 0.3s ease;
    }
    input[type="text"]:focus, input[type="password"]:focus { border-color: #79c255; background: white; }

    /* ESTILOS PARA LA CASILLA "MOSTRAR CONTRASEÑA" */
    .show-password-group {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        font-size: 13px;
        color: #555;
        cursor: pointer;
        user-select: none;
    }
    .show-password-group input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: #4e7e28;
        cursor: pointer;
    }

    .button-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 30px; }
    button {
        padding: 18px;
        border-radius: 12px;
        font-size: 16px;
        border: none;
        cursor: pointer;
        background: #f3f3f3;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        transition: all 0.2s ease;
        font-weight: 600;
        color: #333;
    }
    .btn-next { background: #4e7e28; color: white; }
    #message { margin-top: 15px; font-size: 14px; font-weight: bold; min-height: 20px; line-height: 1.4; }
</style>
</head>
<body>

<div class="container">
    <div class="logos">
        <img src="https://raw.githubusercontent.com/Juanlubaz/Enlaces-estructuras-TSP3/main/GESTI.png" alt="Logo">
    </div>
    <h1>LOGIN ACCESS</h1>

    <div class="form-group">
        <label>USER</label>
        <input type="text" id="userInput" placeholder="Username" autocomplete="username">
    </div>

    <div class="form-group">
        <label>PASSWORD</label>
        <input type="password" id="passInput" placeholder="Password" autocomplete="current-password">
        
        <!-- CHECKBOX PARA MOSTRAR/OCULTAR CONTRASEÑA -->
        <label class="show-password-group">
            <input type="checkbox" id="togglePass" onclick="togglePasswordVisibility()">
            Mostrar contraseña
        </label>
    </div>

    <div id="message"></div>

    <div class="button-grid">
        <button onclick="window.location.href='change.html'">CHANGE PASSWORD</button>
        <button class="btn-next" id="loginBtn" onclick="validateLogin()">NEXT</button>
    </div>
</div>

<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbzCYdQHxJQs6VWDOynidXLpr3kK6-UYA4kylZLzH37Vv0l94ZclNwZ66NB6c6wXmlDHCw/exec';

    // Función que verifica si la contraseña cumple las reglas de seguridad
    function esContrasenaSegura(password) {
        // Al menos 6 caracteres, 1 mayúscula, 1 minúscula y 1 número
        const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{6,}$/;
        return regex.test(password);
    }

    // Alterna la visibilidad del campo contraseña
    function togglePasswordVisibility() {
        const passInput = document.getElementById('passInput');
        const checkbox = document.getElementById('togglePass');
        passInput.type = checkbox.checked ? 'text' : 'password';
    }

    // Escucha la tecla Intro (Enter) en los inputs
    document.getElementById('userInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') validateLogin();
    });

    document.getElementById('passInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') validateLogin();
    });

    async function validateLogin() {
        const userValue = document.getElementById('userInput').value.trim().toLowerCase();
        const passValue = document.getElementById('passInput').value.trim();
        const messageDiv = document.getElementById('message');
        const loginBtn = document.getElementById('loginBtn');

        if (!userValue || !passValue) {
            messageDiv.style.color = 'orange';
            messageDiv.innerText = 'Por favor, rellena todos los campos';
            return;
        }

        loginBtn.disabled = true;
        messageDiv.style.color = '#666';
        messageDiv.innerText = 'Verificando...';

        // Capturamos la fecha/hora del cliente para enviarla en el payload
        const fechaHoraCliente = new Date().toLocaleString('es-ES');

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify({
                    action: 'login',
                    user: userValue,
                    password: passValue,
                    timestamp: fechaHoraCliente
                })
            });

            if (!response.ok) {
                throw new Error('Respuesta no válida del servidor');
            }

            const result = await response.json();

            if (result.success) {
                // COMPROBACIÓN DE REQUISITOS DE CONTRASEÑA SEGURA
                if (!esContrasenaSegura(passValue)) {
                    messageDiv.style.color = 'orange';
                    messageDiv.innerText = 'Tu contraseña debe ser actualizada (mín. 6 caracteres, mayúscula, minúscula y número). Redirigiendo a cambio de clave...';
                    
                    setTimeout(() => {
                        window.location.href = 'change.html';
                    }, 2500);
                    return;
                }

                // SI CUMPLE TODOS LOS REQUISITOS
                messageDiv.style.color = '#4e7e28';
                messageDiv.innerText = 'ACCESO CORRECTO';

                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('loggedUser', userValue);

                setTimeout(() => {
                    window.location.href = 'principal.html';
                }, 800);
            } else {
                messageDiv.style.color = '#d93025';
                messageDiv.innerText = result.message || 'Usuario o contraseña incorrectos';
            }
        } catch (error) {
            console.error(error);
            messageDiv.style.color = 'red';
            messageDiv.innerText = 'Error al conectar con la base de datos';
        } finally {
            loginBtn.disabled = false;
        }
    }
</script>

</body>
</html>
