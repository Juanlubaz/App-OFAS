<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ingenierías - Document Search</title>
<style>
    /* ESTILOS BASE */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #6fb543, #79c255); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .container { background: white; width: 100%; max-width: 900px; border-radius: 20px; padding: 40px; box-shadow: 0 6px 20px rgba(0,0,0,0.15); text-align: center; }
    .logos { display: flex; justify-content: center; align-items: center; margin-bottom: 30px; flex-wrap: wrap; }
    .logos img { max-height: 120px; max-width: 100%; height: auto; width: auto; object-fit: contain; }
    h1 { color: #4e7e28; margin-bottom: 30px; font-size: 28px; }

    /* RECUADRO DE BOTONES PRIMER NIVEL (DINÁMICOS) */
    .options-box {
        border: 2px dashed #79c255;
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 25px;
        background-color: #f9fdf6;
    }
    .options-title { font-size: 14px; color: #4e7e28; font-weight: bold; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
    .options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 0 auto; }

    /* CONTENEDOR DE FORMULARIOS DESPLEGABLES */
    .form-group { max-width: 740px; margin: 0 auto 20px auto; text-align: left; }
    label { display: block; color: #555; font-weight: 600; margin-bottom: 8px; font-size: 1.1em; }
    select { width: 100%; padding: 14px 15px; border: 2px solid #ddd; border-radius: 12px; font-size: 16px; background: white; cursor: pointer; transition: border-color 0.3s; outline: none; }
    select:focus { border-color: #79c255; }
    select:disabled { background: #f5f5f5; cursor: not-allowed; border-color: #eee; }

    /* CONTENEDOR DINÁMICO PARA LOS PDFs */
    .multi-docs-box {
        display: none;
        background: #f4fbf1;
        border: 1px solid #ccebc4;
        border-radius: 12px;
        padding: 20px;
        margin: 10px auto 25px auto;
        max-width: 740px;
        text-align: left;
    }
    .multi-docs-title { font-size: 15px; color: #4e7e28; font-weight: bold; margin-bottom: 12px; }
    .multi-docs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    
    .btn-doc-link {
        background: #79c255 !important;
        color: white !important;
        font-size: 14px !important;
        padding: 12px !important;
        border-radius: 8px !important;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1) !important;
        text-align: left !important;
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
        display: block !important;
        width: 100% !important;
        border: none;
        cursor: pointer;
    }
    .btn-doc-link:hover { background: #609e42 !important; transform: translateY(-2px) !important; }

    /* ESTILO GENERAL DE LOS BOTONES DE OPCIÓN */
    button.btn-option { padding: 15px; border-radius: 12px; font-size: 15px; border: 2px solid #ccc; cursor: pointer; background: #fff; box-shadow: 0 3px 6px rgba(0,0,0,0.08); transition: all 0.2s ease; font-weight: 600; color: #333; }
    button.btn-option:hover { background: #e8e8e8; transform: translateY(-2px); }
    button.btn-option.active { background: #79c255; color: white; border-color: #4e7e28; }

    .back-link { display: inline-block; margin-top: 30px; color: #79c255; text-decoration: none; font-weight: bold; font-size: 16px; }
    .back-link:hover { text-decoration: underline; }

    .loading { text-align: center; padding: 20px; color: #4e7e28; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
    <div class="logos">
        <img src="https://raw.githubusercontent.com/Juanlubaz/Enlaces-estructuras-TSP3/main/GESTI.png" alt="Gestiproject Logo" />
    </div>
    
    <h1>Engineering Documents</h1>

    <!-- Primer Nivel: Botones Dinámicos creados desde las subcarpetas raíz -->
    <div class="options-box">
        <div class="options-title">Especialidad / Área</div>
        <div id="firstLevelGrid" class="options-grid">
            <div class="loading">Cargando áreas de ingeniería...</div>
        </div>
    </div>

    <!-- Segundo Nivel: Desplegables de Subcarpetas / Documentos -->
    <div id="dropdownsContainer" style="display:none;">
        <div class="form-group">
            <label id="labelSubcarpeta" for="selectSubcarpeta">Selecciona Subcategoría:</label>
            <select id="selectSubcarpeta">
                <option value="">-- Esperando selección --</option>
            </select>
        </div>
    </div>

    <!-- Cuadrícula Dinámica de Archivos PDF -->
    <div id="multiDocsBox" class="multi-docs-box">
        <div id="multiDocsTitle" class="multi-docs-title">Planos / Documentos encontrados:</div>
        <div id="multiDocsGrid" class="multi-docs-grid"></div>
    </div>

    <a href="principal.html" class="back-link">← Back to Principal</a>
</div>

<script>
    // ID de la carpeta principal de Google Drive que nos proporcionaste
    const ROOT_FOLDER_ID = "1uR3V2zeLP1VtuX7kmfKGedaDKS5s7QsH";
    
    // Endpoints de Google Apps Script
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzfVd7zRhvmgRt6L8budTkPmNkzJUb6nukRUjyOfx6Pn8rcm8zS_oHiJyTHu7AOmMRj9w/exec";
    const VISOR_PDF_URL = 'https://script.google.com/macros/s/AKfycbz7OHOqzkSYfzCTOMdiUJKeiKu204K3Ki8keZmWghKdv1sZp0MZMb6Ngehrtn5TpBO5fw/exec';[cite: 1]

    let currentFirstLevelId = null;

    // Carga inicial: Consulta la carpeta raíz para dibujar los primeros botones
    function loadRootCategories() {
        callAppsScript(ROOT_FOLDER_ID, "renderFirstLevelButtons");
    }

    // Callback para renderizar los botones del primer nivel
    function renderFirstLevelButtons(response) {
        const grid = document.getElementById('firstLevelGrid');
        grid.innerHTML = '';

        if (!response || response.error || !response.folders || response.folders.length === 0) {
            grid.innerHTML = '<div style="color:#d9534f; grid-column: 1/-1;">No se encontraron subcarpetas principales o la carpeta no está compartida.</div>';
            return;
        }

        response.folders.forEach(folder => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'btn-option';
            btn.innerText = folder.name.toUpperCase();
            btn.onclick = function() { selectFirstLevel(folder.id, this); };
            grid.appendChild(btn);
        });
    }

    // Al hacer clic en un botón del primer nivel
    function selectFirstLevel(folderId, btnElement) {
        // Marcamos botón activo
        document.querySelectorAll('.btn-option').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');

        currentFirstLevelId = folderId;
        hideMultiDocsBox();

        const select = document.getElementById('selectSubcarpeta');
        select.innerHTML = '<option value="">Cargando subcategorías...</option>';
        select.disabled = true;
        document.getElementById('dropdownsContainer').style.display = 'block';

        // Consultamos las subcarpetas del botón seleccionado
        callAppsScript(folderId, "renderSecondLevelDropdown");
    }

    // Callback para llenar el desplegable del segundo nivel
    function renderSecondLevelDropdown(response) {
        const select = document.getElementById('selectSubcarpeta');
        select.innerHTML = '';

        if (!response || response.error) {
            select.innerHTML = '<option value="">Error al obtener subcategorías</option>';
            return;
        }

        // Si la carpeta tiene subcarpetas
        if (response.folders && response.folders.length > 0) {
            select.innerHTML = '<option value="">-- Selecciona una subcategoría --</option>';
            response.folders.forEach(subfolder => {
                const opt = document.createElement('option');
                opt.value = subfolder.id;
                opt.innerText = subfolder.name;
                select.appendChild(opt);
            });
            select.disabled = false;
        } else {
            // Si no tiene subcarpetas, pero sí archivos directos
            select.innerHTML = '<option value="">-- Archivos directos en esta categoría --</option>';
            select.disabled = true;
            if (response.files && response.files.length > 0) {
                renderFilesList(response.files);
            }
        }
    }

    // Evento de cambio en el desplegable
    function onSecondLevelChange() {
        const folderId = document.getElementById('selectSubcarpeta').value;
        hideMultiDocsBox();

        if (!folderId) return;

        // Consultamos los archivos de la subcarpeta elegida
        callAppsScript(folderId, "renderFilesListCallback");
    }

    function renderFilesListCallback(response) {
        if (!response || response.error || !response.files || response.files.length === 0) {
            alert("No se encontraron archivos disponibles en esta sección.");
            return;
        }
        renderFilesList(response.files);
    }

    // Renderiza los botones para abrir cada PDF con el Visor
    function renderFilesList(files) {
        const multiBox = document.getElementById('multiDocsBox');
        const multiGrid = document.getElementById('multiDocsGrid');
        multiGrid.innerHTML = '';

        files.forEach(file => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'btn-doc-link';
            btn.title = file.name;
            btn.innerText = "📄 " + file.name;
            btn.onclick = function() { abrirDocumentoVisor(file.id || file.url); };
            multiGrid.appendChild(btn);
        });

        multiBox.style.display = 'block';
    }

    // Conexión con tu Visor PDF Unificado
    function abrirDocumentoVisor(idOrUrl) {
        let fileId = idOrUrl;
        if (idOrUrl.includes('http')) {
            fileId = idOrUrl.split('/file/d/')[1]?.split('/')[0] || idOrUrl.split('id=')[1]?.split('&')[0];
        }
        
        if (!fileId) return alert("No se pudo identificar el archivo.");

        var separador = VISOR_PDF_URL.includes('?') ? '&' : '?';[cite: 1]
        var visorUrl = VISOR_PDF_URL + separador + 'id=' + encodeURIComponent(fileId);[cite: 1]
        window.open(visorUrl, '_blank', 'noopener,noreferrer');[cite: 1]
    }

    function hideMultiDocsBox() {
        document.getElementById('multiDocsBox').style.display = 'none';
    }

    // Función auxiliar para consultar Apps Script por JSONP evitando bloqueos CORS
    function callAppsScript(folderId, callbackName) {
        const scriptNode = document.createElement('script');
        scriptNode.src = SCRIPT_URL + "?folderId=" + folderId + "&callback=" + callbackName;
        document.body.appendChild(scriptNode);
    }

    document.getElementById('selectSubcarpeta').addEventListener('change', onSecondLevelChange);

    window.onload = loadRootCategories;
</script>

</body>
</html>
